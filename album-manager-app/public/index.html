<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Album Manager</h1>
        <button id="add-album-btn" class="primary-btn">
            <span class="icon">+</span> Add Album
        </button>
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search albums...">
        </div>
    </header>
    <main>
        <section id="albums-container" class="album-grid">
        </section>
    </main>

    <div id="album-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Add Album</h2>
            <form id="album-form">
                <label for="artist">Artist:</label>
                <input type="text" id="artist" name="artist" placeholder="Enter artist name" required>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" placeholder="Enter album title" required>
                <label for="duration">Duration:</label>
                <input type="text" id="duration" name="duration" placeholder="e.g., 45:30" required>
                <label for="trackCount">Track Count:</label>
                <input type="number" id="trackCount" name="trackCount" placeholder="Enter number of tracks" required>
                <div class="form-actions">
                    <button type="submit" class="primary-btn">Save</button>
                    <button type="button" id="cancel-btn" class="secondary-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
