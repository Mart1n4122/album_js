<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Album Manager</h1>
        <input type="text" id="searchBar" placeholder="Search albums...">
    </header>
    <main>
        <section id="albumList">
            <h2>Albums</h2>
            <ul id="albums"></ul>
        </section>
        <section id="albumDetails">
            <h2>Album Details</h2>
            <div id="details"></div>
        </section>
        <section id="albumForm">
            <h2>Add/Modify Album</h2>
            <form id="albumFormElement">
                <input type="text" id="bandName" placeholder="Band Name" required>
                <input type="text" id="albumTitle" placeholder="Album Title" required>
                <input type="number" id="numberOfSongs" placeholder="Number of Songs" required>
                <input type="number" id="releaseYear" placeholder="Release Year" required>
                <button type="submit">Save Album</button>
            </form>
        </section>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
